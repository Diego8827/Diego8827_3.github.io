<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUDI · Administración</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#102F68;--blue:#1265C8;--orange:#FF8A00;--red:#E52424;--yellow:#FFD52A;--green:#159447;--bg:#F4F6FA;--surface:#FFFFFF;--text:#14203A;--muted:#5D6B86;--line:#D9DFEB;--side:#102F68;--side-text:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1527;--surface:#152238;--text:#E8EEFA;--muted:#9AA9C6;--line:#26365A;--side:#0A1A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1527;--surface:#152238;--text:#E8EEFA;--muted:#9AA9C6;--line:#26365A;--side:#0A1A3A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#app{display:flex;min-height:100vh}
nav{width:240px;background:var(--side);color:var(--side-text);padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:900;font-size:1.6rem;letter-spacing:-.02em;padding:4px 10px 2px}
.stripe{height:5px;margin:0 10px 16px;border-radius:3px;background:linear-gradient(90deg,var(--red) 33%,var(--yellow) 33% 66%,var(--green) 66%)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;opacity:.85}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current="page"]{background:var(--blue);opacity:1;font-weight:600}
main{flex:1;min-width:0;padding:20px}
.top{display:none;align-items:center;gap:12px;margin-bottom:12px}
.burger{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px}
h1{margin:0 0 14px;font-size:1.5rem;color:var(--text)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.warn{background:var(--red)}.btn.ok{background:var(--green)}.btn.sm{padding:4px 9px;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:5px solid var(--blue)}
.kpi small{color:var(--muted);display:block}.kpi b{font-size:1.35rem}
.kpi.g{border-left-color:var(--green)}.kpi.o{border-left-color:var(--orange)}.kpi.r{border-left-color:var(--red)}.kpi.y{border-left-color:var(--yellow)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.wrap{white-space:normal;min-width:180px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;background:var(--line)}
.tag.green{background:var(--green);color:#fff}.tag.red{background:var(--red);color:#fff}.tag.yellow{background:var(--yellow);color:#14203A}.tag.blue{background:var(--blue);color:#fff}
.empty{color:var(--muted);padding:18px 0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.frm .full{grid-column:1/-1}
dialog{border:0;border-radius:14px;padding:20px;width:min(760px,94vw);background:var(--surface);color:var(--text);max-height:92vh}
dialog::backdrop{background:rgba(10,20,40,.55)}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}
.chart div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-width:6px;position:relative}
.chart div.neg{background:var(--red)}
.note{color:var(--muted);font-size:.85rem}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;margin:2px}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:99}
.kpi.g,.kpi.o,.kpi.y{border-left-color:var(--line)}
@media (max-width:820px){
 nav{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
 nav.open{transform:none}.top{display:flex}main{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<nav id="nav" aria-label="Menú principal"><img src="/logo/logo_roudi.png" alt="ROUDI" style="width:100%;background:#fff;border-radius:10px;padding:4px;margin-bottom:12px"><div id="menu"></div><button id="out" style="margin-top:14px;border-top:1px solid rgba(255,255,255,.2);border-radius:0">Cerrar sesión</button></nav>
<main><div class="top"><button class="burger" id="burger" aria-label="Abrir menú">☰ Menú</button><b>ROUDI Admin</b></div><div id="view"><p class="empty">Cargando…</p></div></main>
</div>
<dialog id="dlg"></dialog><div id="msg" role="status"></div>

<script>
var DB=null,USER=null,DL=null,AS=null,UID="",S={},V="inicio",CUR=null,TOK=false;
var COLS=["products","categories","promos","orders","customers","suppliers","points","expenses","log","config","drivers"];
var MENU=[["inicio","Inicio"],["products","Productos"],["categories","Categorías"],["promos","Ofertas y promociones"],["orders","Pedidos"],["assistant","Asistente y entregas"],["customers","Clientes"],["inventory","Inventario"],["suppliers","Proveedores"],["points","Puntos de entrega"],["drivers","Repartidores"],["reports","Reportes y estadísticas"],["config","Configuración"]];
var STATUS=["pendiente","pagado","enviado","entregado","cancelado"],COLLECTED=["pagado","enviado","entregado"];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return "Bs "+(Number(n)||0).toFixed(2)}
function msg(t){var m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display="none"},2600)}
function C(c){return S[c]||[]}
function byId(c,id){return C(c).filter(function(x){return x.id===id})[0]}
function cfg(){var c=byId("config","main")||{};return{minMargin:c.minMargin==null?10:Number(c.minMargin),lowStock:c.lowStock==null?5:Number(c.lowStock)}}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fdate(t){return t?new Date(t).toLocaleString("es-BO",{dateStyle:"short",timeStyle:"short"}):""}

/* ---------- datos ---------- */
function log(a,d){return DB.collection("log").add({t:Date.now(),by:UID,action:a,detail:d||""})}
function put(c,id,o,a){return DB.collection(c).doc(id).set(o).then(function(){return log(a||("Guardó en "+c),(o.name||o.num||id))})}
function del(c,id,n){if(!confirm("¿Eliminar definitivamente?"))return;DB.collection(c).doc(id).delete().then(function(){log("Eliminó de "+c,n||id);msg("Eliminado")})}
function strip(o){var r={};Object.keys(o).forEach(function(k){if(k!=="id")r[k]=o[k]});return r}

/* ---------- precios y promociones ---------- */
function promoOn(pr,p,now){
  if(!pr.active||(pr.start&&new Date(pr.start)>now)||(pr.end&&new Date(pr.end)<now))return false;
  return (pr.targets||[]).some(function(t){return t==="p:"+p.id||t==="c:"+p.cat});
}
function applyPromo(pr,price){return Math.max(0,pr.type==="pct"?price*(1-pr.value/100):price-pr.value)}
function livePrice(p,now){
  var best=Number(p.promo)>0?Number(p.promo):Number(p.price);now=now||new Date();
  C("promos").forEach(function(pr){if(promoOn(pr,p,now))best=Math.min(best,applyPromo(pr,Number(p.price)))});
  return best;
}
function floorPrice(p){return (Number(p.cost)+Number(p.extra||0))*(1+cfg().minMargin/100)}

/* ---------- formularios genéricos ---------- */
function field(f,v){
  var id="f_"+f.k,val=v==null?(f.def==null?"":f.def):v,h="";
  if(f.t==="select"){h='<select id="'+id+'">'+f.opts().map(function(o){var ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;return '<option value="'+esc(ov)+'"'+(ov==val?" selected":"")+'>'+esc(ol)+'</option>'}).join("")+'</select>'}
  else if(f.t==="textarea"){h='<textarea id="'+id+'" rows="3">'+esc(val)+'</textarea>'}
  else if(f.t==="check"){return '<label class="'+(f.full?"full":"")+'"><input type="checkbox" id="'+id+'" style="width:auto"'+(val?" checked":"")+'> '+f.l+'</label>'}
  else h='<input id="'+id+'" type="'+(f.t||"text")+'" value="'+esc(val)+'"'+(f.step?' step="'+f.step+'"':"")+(f.t==="number"?' min="0"':"")+'>';
  return '<label class="'+(f.full?"full":"")+'">'+f.l+h+'</label>';
}
function read(fs){var o={};fs.forEach(function(f){var e=$("f_"+f.k);o[f.k]=f.t==="check"?e.checked:f.t==="number"?Number(e.value||0):e.value.trim()});return o}
function openForm(title,fs,data,onSave,extra){
  data=data||{};
  $("dlg").innerHTML='<h2 style="margin-top:0">'+title+'</h2><div class="frm">'+fs.map(function(f){return field(f,data[f.k])}).join("")+'</div>'+(extra||"")+'<div class="bar" style="margin-top:12px"><button class="btn" id="ok">Guardar</button><button class="btn alt" id="no">Cancelar</button></div>';
  $("no").onclick=function(){$("dlg").close()};
  $("ok").onclick=function(){
    var o=read(fs);
    if(fs[0].req!==false&&!o[fs[0].k]){msg("Completa el campo «"+fs[0].l+"»");return}
    $("ok").disabled=true;
    Promise.resolve(onSave(o)).then(function(r){if(r!==false)$("dlg").close();$("ok").disabled=false},function(e){$("ok").disabled=false;msg("No se pudo guardar: "+(e&&e.message||e))});
  };
  $("dlg").showModal();
}
function table(cols,rows,acts){
  if(!rows.length)return '<p class="empty">Aún no hay registros. Usa «Nuevo» para agregar el primero.</p>';
  return '<div class="scroll"><table><thead><tr>'+cols.map(function(c){return '<th>'+c[0]+'</th>'}).join("")+(acts?'<th></th>':"")+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+cols.map(function(c){return '<td>'+c[1](r)+'</td>'}).join("")+(acts?'<td>'+acts(r)+'</td>':"")+'</tr>'}).join("")+'</tbody></table></div>';
}
function csv(name,head,rows){
  var t=[head].concat(rows).map(function(r){return r.map(function(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  if(!DL){msg("La descarga no está disponible en esta vista");return}
  DL.save({filename:name,data:"\ufeff"+"ROUDI · "+name.replace(".csv","")+" · generado "+fdate(Date.now())+"\r\n"+t}).then(function(){msg("Archivo listo")},function(){msg("Descarga cancelada")});
}

/* ---------- secciones simples ---------- */
var SIMPLE={
 drivers:{t:"Repartidores",f:[{k:"name",l:"Nombre"},{k:"phone",l:"Celular (con código de país, ej. 59171234567)"},{k:"active",l:"Activo",t:"check",def:true}],cols:[["Nombre",function(r){return esc(r.name)}],["Celular",function(r){return esc(r.phone)}],["Estado",function(r){return r.active?'<span class="tag green">activo</span>':'<span class="tag">inactivo</span>'}],["Pedidos pendientes",function(r){return C("orders").filter(function(o){return o.driver===r.id&&o.status!=="entregado"&&o.status!=="cancelado"}).length}]]},
 categories:{t:"Categorías",f:[{k:"name",l:"Nombre"}],cols:[["Categoría",function(r){return esc(r.name)}],["Productos",function(r){return C("products").filter(function(p){return p.cat===r.id}).length}]]},
 customers:{t:"Clientes",f:[{k:"name",l:"Nombre"},{k:"phone",l:"Teléfono"},{k:"email",l:"Correo"},{k:"address",l:"Dirección",full:true}],cols:[["Nombre",function(r){return esc(r.name)}],["Teléfono",function(r){return esc(r.phone)}],["Correo",function(r){return esc(r.email)}],["Pedidos",function(r){return C("orders").filter(function(o){return o.customer===r.id}).length}]]},
 suppliers:{t:"Proveedores",f:[{k:"name",l:"Proveedor"},{k:"contact",l:"Contacto"},{k:"phone",l:"Teléfono"},{k:"notes",l:"Productos que suministra",t:"textarea",full:true}],cols:[["Proveedor",function(r){return esc(r.name)}],["Contacto",function(r){return esc(r.contact)}],["Teléfono",function(r){return esc(r.phone)}],["Suministra",function(r){return esc(r.notes)}]]},
 points:{t:"Puntos de entrega",f:[{k:"name",l:"Nombre del punto"},{k:"address",l:"Dirección",full:true},{k:"hours",l:"Horario"},{k:"active",l:"Activo",t:"check",def:true}],cols:[["Punto",function(r){return esc(r.name)}],["Dirección",function(r){return esc(r.address)}],["Horario",function(r){return esc(r.hours)}],["Estado",function(r){return r.active?'<span class="tag green">activo</span>':'<span class="tag">inactivo</span>'}]]}
};
function simple(c){
  var s=SIMPLE[c],rows=C(c);
  $("view").innerHTML='<h1>'+s.t+'</h1><div class="bar"><button class="btn" id="new">+ Nuevo</button></div><div class="card">'+table(s.cols,rows,function(r){return '<button class="btn alt sm" data-e="'+r.id+'">Editar</button> <button class="btn warn sm" data-d="'+r.id+'">Eliminar</button>'})+'</div>';
  $("new").onclick=function(){openForm("Nuevo",s.f,null,function(o){return put(c,uid(),o)})};
  $("view").onclick=function(e){var t=e.target;
    if(t.dataset.e){var r=byId(c,t.dataset.e);openForm("Editar",s.f,r,function(o){return put(c,r.id,o)})}
    if(t.dataset.d){var q=byId(c,t.dataset.d);del(c,q.id,q.name)}};
}

/* ---------- productos ---------- */
function prodFields(){return[
 {k:"name",l:"Nombre"},{k:"sku",l:"Código SKU"},{k:"desc",l:"Descripción",t:"textarea",full:true},
 {k:"cat",l:"Categoría",t:"select",opts:function(){return [["","— Sin categoría —"]].concat(C("categories").map(function(c){return [c.id,c.name]}))}},
 {k:"cost",l:"Precio de compra (Bs)",t:"number",step:"0.01"},{k:"extra",l:"Costos adicionales (Bs)",t:"number",step:"0.01"},
 {k:"price",l:"Precio de venta (Bs)",t:"number",step:"0.01"},{k:"promo",l:"Precio promocional (Bs, opcional)",t:"number",step:"0.01"},
 {k:"stock",l:"Cantidad disponible",t:"number"},{k:"avail",l:"Disponibilidad",t:"select",opts:function(){return [["stock","En stock"],["pedido","Bajo pedido"]]}},
 {k:"warranty",l:"Garantía"},{k:"status",l:"Estado",t:"select",opts:function(){return [["borrador","Borrador"],["publicado","Publicado"],["desactivado","Desactivado"]]}}]}
function products(){
  var q=(CUR&&CUR.q)||"";
  var rows=C("products").filter(function(p){return !q||(p.name+" "+p.sku).toLowerCase().indexOf(q.toLowerCase())>-1});
  $("view").innerHTML='<h1>Productos</h1><div class="bar"><button class="btn" id="new">+ Nuevo producto</button><input id="q" placeholder="Buscar por nombre o SKU" value="'+esc(q)+'"></div><div class="card">'+table([
   ["Foto",function(p){return p.photos&&p.photos[0]?'<img src="'+esc(p.photos[0])+'" alt="" width="40" height="40" style="object-fit:cover;border-radius:6px">':""}],
   ["Producto",function(p){return esc(p.name)+'<br><small class="note">'+esc(p.sku)+'</small>'}],
   ["Categoría",function(p){var c=byId("categories",p.cat);return c?esc(c.name):"—"}],
   ["Compra+extras",function(p){return money(Number(p.cost)+Number(p.extra||0))}],
   ["Venta",function(p){var l=livePrice(p);return l<Number(p.price)?'<s>'+money(p.price)+'</s> <b>'+money(l)+'</b> <span class="tag red">oferta</span>':money(p.price)}],
   ["Stock",function(p){return p.avail==="pedido"?"bajo pedido":p.stock}],
   ["Estado",function(p){return '<span class="tag '+(p.status==="publicado"?"green":p.status==="borrador"?"yellow":"")+'">'+esc(p.status)+'</span>'}]
  ],rows,function(p){return '<button class="btn alt sm" data-e="'+p.id+'">Editar</button> <button class="btn alt sm" data-c="'+p.id+'">Duplicar</button> '+(p.status!=="publicado"?'<button class="btn ok sm" data-p="'+p.id+'">Publicar</button> ':"")+'<button class="btn warn sm" data-d="'+p.id+'">Eliminar</button>'})+'</div>';
  $("q").oninput=function(e){CUR={q:e.target.value};products();$("q").focus();var l=$("q").value.length;$("q").setSelectionRange(l,l)};
  $("new").onclick=function(){prodForm({status:"borrador",avail:"stock",photos:[]})};
  $("view").onclick=function(e){var t=e.target,p;
    if(t.dataset.e)prodForm(byId("products",t.dataset.e));
    if(t.dataset.c){p=byId("products",t.dataset.c);var n=strip(p);n.name=p.name+" (copia)";n.sku=p.sku+"-COPIA";n.status="borrador";n.hist=[];put("products",uid(),n,"Duplicó producto")}
    if(t.dataset.p){p=byId("products",t.dataset.p);var m=strip(p);m.status="publicado";put("products",p.id,m,"Publicó producto")}
    if(t.dataset.d){p=byId("products",t.dataset.d);del("products",p.id,p.name)}};
}
function prodForm(p){
  var photos=(p.photos||[]).slice(),fs=prodFields(),isNew=!p.id;
  var extra='<label class="full">Fotografías (puedes elegir varias)<input type="file" id="ph" accept="image/*" multiple '+(AS?"":"disabled")+'></label><div class="thumbs" id="th"></div>'+(AS?"":'<p class="note">La carga de fotos requiere permisos de editor.</p>');
  openForm(isNew?"Nuevo producto":"Editar producto",fs,p,function(o){
    if(o.price<=0){msg("El precio de venta debe ser mayor que 0");return false}
    var d=Object.assign(strip(p),o,{photos:photos}),h=(p.hist||[]).slice();
    if(isNew||Number(p.price)!==o.price||Number(p.cost)!==o.cost||Number(p.promo||0)!==o.promo)h.push({t:Date.now(),by:UID,price:o.price,promo:o.promo,cost:o.cost});
    d.hist=h;return put("products",p.id||uid(),d,isNew?"Creó producto":"Editó producto");
  },extra);
  function th(){$("th").innerHTML=photos.map(function(u,i){return '<img src="'+esc(u)+'" alt="Foto '+(i+1)+'" data-x="'+i+'" title="Clic para quitar">'}).join("")}
  th();$("th").onclick=function(e){if(e.target.dataset.x){photos.splice(+e.target.dataset.x,1);th()}};
  $("ph").onchange=function(e){var fl=Array.prototype.slice.call(e.target.files);msg("Subiendo fotos…");
    Promise.all(fl.map(function(f){return AS.upload(f)})).then(function(r){r.forEach(function(x){photos.push(x.url)});th();msg("Fotos cargadas")},function(){msg("No se pudo subir la foto")})};
}

/* ---------- ofertas ---------- */
function promoViolations(pr){
  var now=new Date(),v=[];
  C("products").forEach(function(p){
    if(!(pr.targets||[]).some(function(t){return t==="p:"+p.id||t==="c:"+p.cat}))return;
    var np=applyPromo(pr,Number(p.price));if(np<floorPrice(p))v.push(p.name+" ("+money(np)+" < mínimo "+money(floorPrice(p))+")");
  });return v;
}
function promos(){
  var now=new Date();
  $("view").innerHTML='<h1>Ofertas y promociones</h1><div class="bar"><button class="btn" id="new">+ Nueva promoción</button></div><div class="card">'+table([
   ["Promoción",function(r){return esc(r.name)+'<br><small class="note">'+esc(r.campaign||"")+'</small>'}],
   ["Descuento",function(r){return r.type==="pct"?r.value+"%":money(r.value)}],
   ["Vigencia",function(r){return fdate(r.start)+" → "+fdate(r.end)}],
   ["Aplica a",function(r){return (r.targets||[]).map(function(t){var x=t[0]==="p"?byId("products",t.slice(2)):byId("categories",t.slice(2));return x?esc(x.name):""}).join(", ")}],
   ["Estado",function(r){var on=r.active&&(!r.start||new Date(r.start)<=now)&&(!r.end||new Date(r.end)>=now);var f=r.end&&new Date(r.end)<now;return f?'<span class="tag">finalizada</span>':on?'<span class="tag green">vigente</span>':'<span class="tag yellow">programada/inactiva</span>'}]
  ],C("promos"),function(r){return '<button class="btn alt sm" data-e="'+r.id+'">Editar</button> <button class="btn warn sm" data-d="'+r.id+'">Eliminar</button>'})+'<p class="note">Las promociones finalizadas quedan como historial. El margen mínimo de rentabilidad actual es '+cfg().minMargin+'% sobre el costo.</p></div>';
  $("new").onclick=function(){promoForm({type:"pct",active:true})};
  $("view").onclick=function(e){var t=e.target;if(t.dataset.e)promoForm(byId("promos",t.dataset.e));if(t.dataset.d){var r=byId("promos",t.dataset.d);del("promos",r.id,r.name)}};
}
function promoForm(p){

/* ---------- finanzas ---------- */
function stats(from,to,cat,prod){
  var o=C("orders").filter(function(x){return (!from||x.date>=from)&&(!to||x.date<=to)});
  var r={orders:o,n:0,gross:0,collected:0,pending:0,cost:0,disc:0,units:{},revCat:{}};
  o.forEach(function(x){
    var ls=x.lines.filter(function(l){var p=byId("products",l.pid);return (!prod||l.pid===prod)&&(!cat||(p&&p.cat===cat))});
    if(!ls.length||x.status==="cancelado")return;
    var t=ls.reduce(function(s,l){return s+l.qty*l.price},0),d=ls.reduce(function(s,l){return s+l.qty*(l.list-l.price)},0),c=ls.reduce(function(s,l){return s+l.qty*l.cost},0);
    r.n++;r.gross+=t;
    if(COLLECTED.indexOf(x.status)>-1){r.collected+=t;r.cost+=c;r.disc+=d;ls.forEach(function(l){r.units[l.name]=(r.units[l.name]||0)+l.qty;var p=byId("products",l.pid),cn=p&&byId("categories",p.cat)?byId("categories",p.cat).name:"Sin categoría";r.revCat[cn]=(r.revCat[cn]||0)+l.qty*l.price})}
    else r.pending+=t;
  });
  r.exp=C("expenses").filter(function(e){return (!from||e.date>=from)&&(!to||e.date<=to)}).reduce(function(s,e){return s+Number(e.amount)},0);
  r.profit=r.collected-r.cost-r.exp;r.ticket=r.n?r.gross/r.n:0;return r;
}
function kpis(r){return '<div class="kpis"><div class="kpi"><small>Ventas brutas (sin cancelados)</small><b>'+money(r.gross)+'</b></div><div class="kpi g"><small>Ingresos cobrados</small><b>'+money(r.collected)+'</b></div><div class="kpi y"><small>Por cobrar (pendientes)</small><b>'+money(r.pending)+'</b></div><div class="kpi o"><small>Costos de adquisición</small><b>'+money(r.cost)+'</b></div><div class="kpi o"><small>Descuentos aplicados</small><b>'+money(r.disc)+'</b></div><div class="kpi r"><small>Gastos registrados</small><b>'+money(r.exp)+'</b></div><div class="kpi g"><small>Margen bruto estimado</small><b>'+money(r.collected-r.cost)+'</b></div><div class="kpi '+(r.profit<0?"r":"g")+'"><small>Utilidad estimada</small><b>'+money(r.profit)+'</b></div><div class="kpi"><small>Pedidos / ticket promedio</small><b>'+r.n+' · '+money(r.ticket)+'</b></div></div>'}
function groupBy(from,to,mode,cat,prod){
  var g={};C("orders").forEach(function(x){
    if(COLLECTED.indexOf(x.status)<0||x.date<from||x.date>to)return;
    var d=new Date(x.date),k;
    if(mode==="m")k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    else if(mode==="w"){var m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));k=m.toISOString().slice(0,10)}
    else k=d.toISOString().slice(0,10);
    var t=x.lines.filter(function(l){var p=byId("products",l.pid);return (!prod||l.pid===prod)&&(!cat||(p&&p.cat===cat))}).reduce(function(s,l){return s+l.qty*l.price},0);
    g[k]=(g[k]||0)+t});
  return Object.keys(g).sort().map(function(k){return [k,g[k]]});
}
function chart(data){
  if(!data.length)return '<p class="empty">Sin ventas cobradas en este período.</p>';
  var mx=Math.max.apply(null,data.map(function(d){return d[1]}))||1;
  return '<div class="chart" role="img" aria-label="Ingresos cobrados por período">'+data.map(function(d){return '<div style="height:'+Math.max(3,d[1]/mx*100)+'%" title="'+d[0]+': '+money(d[1])+'"></div>'}).join("")+'</div><p class="note">Barras: ingresos cobrados por período (pasa el cursor para ver el detalle). Máximo: '+money(mx)+'.</p>';
}

var SLOTS=["09:00–11:00","11:00–13:00","15:00–17:00","17:00–19:00"];

function digits(s){return String(s||"").replace(/\D/g,"")}
function demand(days){
  var from=Date.now()-days*864e5,u={};
  C("orders").forEach(function(o){if(o.status==="cancelado"||o.date<from)return;o.lines.forEach(function(l){var r=u[l.pid]||(u[l.pid]={pid:l.pid,name:l.name,units:0,rev:0});r.units+=l.qty;r.rev+=l.qty*l.price})});
  return Object.keys(u).map(function(k){return u[k]}).sort(function(a,b){return b.units-a.units});
}
function alertsData(){
  var low=cfg().lowStock,dem={},out=[],soon=[];demand(30).forEach(function(d){dem[d.pid]=d.units});
  C("products").forEach(function(p){
    if(p.avail!=="stock"||p.status!=="publicado")return;
    var s=Number(p.stock),per=(dem[p.id]||0)/30,days=per>0?s/per:null;
    if(s<=0)out.push({p:p,s:s});else if(s<=low||(days!==null&&days<=5))soon.push({p:p,s:s,days:days});
  });
  return{out:out,soon:soon};
}
function alertText(){
  var a=alertsData(),top=demand(30).slice(0,5);

   "\n\nPOR AGOTAR ("+a.soon.length+"):\n"+(a.soon.length?a.soon.map(function(x){return "- "+x.p.name+": quedan "+x.s+(x.days!==null?" (≈"+Math.max(1,Math.round(x.days))+" días)":"")}).join("\n"):"- Ninguno")+
   "\n\nMÁS COTIZADOS (30 días):\n"+(top.length?top.map(function(d,i){return (i+1)+". "+d.name+": "+d.units+" uds"}).join("\n"):"- Sin ventas aún");
}
function dayOrders(d){return C("orders").filter(function(o){return o.status!=="cancelado"&&o.deliveryDate===d})}
function sortAgenda(a){return a.sort(function(x,y){return (SLOTS.indexOf(x.slot)-SLOTS.indexOf(y.slot))||String(x.pointName).localeCompare(String(y.pointName))})}
function agendaLine(o){return (o.slot||"s/h")+" | "+(o.pointName||"—")+" | "+o.customerName+(o.phone?" ("+o.phone+")":"")+" | "+o.lines.map(function(l){return l.qty+"x "+l.name}).join(", ")+" | "+(o.payment==="efectivo"&&COLLECTED.indexOf(o.status)<0?"COBRAR "+money(o.total):o.status)}

  get:function(){return API("GET","/api/admin/"+c+"/"+encodeURIComponent(id)).then(function(d){return{exists:true,id:id,data:function(){return d}}},function(e){if(e.status===404)return{exists:false};throw e})},
  set:function(o){return API("PUT","/api/admin/"+c+"/"+encodeURIComponent(id),o).then(refresh)},
  update:function(o){return API("PATCH","/api/admin/"+c+"/"+encodeURIComponent(id),o).then(refresh)},
  delete:function(){return API("DELETE","/api/admin/"+c+"/"+encodeURIComponent(id)).then(refresh)}}},
 add:function(){return Promise.resolve()},
 onSnapshot:function(cb){SNAP[c]=cb}}}
function loginView(){
  $("nav").style.display="none";
  $("view").innerHTML='<div class="card" style="max-width:380px;margin:8vh auto"><img src="/logo/logo_roudi.png" alt="ROUDI" style="width:200px;max-width:100%;display:block;margin:0 auto 10px;background:#fff;border-radius:10px"><h1 style="font-size:1.2rem">Acceso de administración</h1><label>Usuario<input id="lu" autocomplete="username"></label><label>Contraseña<input id="lp" type="password" autocomplete="current-password"></label><button class="btn" id="li" style="width:100%">Entrar</button><p class="note" id="le" role="alert"></p></div>';
  var go=function(){API("POST","/api/login",{user:$("lu").value,pass:$("lp").value}).then(function(){location.reload()},function(e){$("le").textContent=e.message})};
  $("li").onclick=go;$("lp").onkeydown=function(e){if(e.key==="Enter")go()};$("lu").focus();
}
function start(me){
  ME=me;UID=me.user;USER=null;DB={collection:ref};$("nav").style.display="";
  DL={save:function(o){return new Promise(function(ok){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([o.data],{type:"text/csv;charset=utf-8"}));a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);ok()})}};
  AS={upload:function(f){return fetch("/api/upload",{method:"POST",credentials:"same-origin",headers:{"X-Roudi":"1","X-Filename":f.name},body:f}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})})}};
  COLS.forEach(function(c){DB.collection(c).onSnapshot(function(s){var prev=S[c];S[c]=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});if(TOK&&c==="orders"&&prev)notifyOrders(prev);if(TOK)show()})});
  $("out").onclick=function(){API("POST","/api/logout").then(function(){location.reload()})};
  $("dlg").addEventListener("close",function(){show()});
  refresh().then(function(){TOK=true;show();setInterval(refresh,6000);var al=alertsData();if(al.out.length||al.soon.length)msg("Asistente: "+al.out.length+" agotado(s) y "+al.soon.length+" por agotar")});
}
function boot(){API("GET","/api/me").then(start,loginView)}
boot();
</script>
